name: Deploy game build

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The website's deploy builds the latest game release.
      - name: Trigger the website deploy
        env:
          FORGE_DEPLOY_URL: ${{ secrets.FORGE_DEPLOY_URL }}
        run: curl --fail --silent --show-error --request POST "$FORGE_DEPLOY_URL"
